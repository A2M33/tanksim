[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tanksim"
dynamic = ["version"]
description = "A water tank and pump run by a small PLC program, with a Modbus TCP server and a browser HMI. No dependencies."
readme = "README.md"
license = "MIT"
authors = [{ name = "A2M33" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["plc", "modbus", "hmi", "scada", "simulator", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/A2M33/tanksim"

[project.scripts]
tanksim = "tanksim.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.dynamic]
version = { attr = "tanksim.__version__" }

[tool.setuptools.package-data]
tanksim = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
